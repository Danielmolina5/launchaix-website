<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Support Desk — LaunchAI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="symbol.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="account.css">
<style>
body{background:#F4F2F7}
.desk{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.dtop{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px}
.dtop img{height:26px}
.dtop .tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:8px;background:var(--ink);color:#fff}
.dtop .sp{margin-left:auto}
.dtabs{display:flex;gap:6px;margin-bottom:14px}
.dtabs button{min-height:42px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:650;background:#fff;box-shadow:var(--shadow);color:var(--mute)}
.dtabs button.on{background:var(--ink);color:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.filters button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:650;background:transparent;box-shadow:0 0 0 1px var(--line2) inset;color:var(--mute)}
.filters button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.filters b{margin-left:4px;color:#FF4D6D}
.grid{display:grid;gap:14px}
.list{display:grid;gap:8px;align-content:start}
.row{display:block;text-align:left;width:100%;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.row.on{box-shadow:0 0 0 2px #C65BD0 inset,var(--shadow)}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.row b{font-size:14.5px;line-height:1.3}
.row p{font-size:13px;color:var(--mute);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row small{display:block;font-size:11.5px;color:var(--dim);margin-top:6px}
.need{box-shadow:0 0 0 2px #FF8A3D inset,var(--shadow)}
.pane{padding:18px;border-radius:24px;background:#fff;box-shadow:var(--shadow);min-height:300px}
.cust{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.cust div{padding:10px 12px;border-radius:12px;background:#FAF7FC;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.cust b{display:block;color:var(--ink);font-size:13.5px}
.canned{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.canned button{padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:#FAF7FC;box-shadow:0 0 0 1px var(--line2) inset}
.reply textarea{width:100%;min-height:110px;font:inherit;font-size:16px;padding:14px;border:0;border-radius:16px;background:#FAF7FC;box-shadow:0 0 0 1px var(--line2) inset;outline:none;resize:vertical}
.reply textarea:focus{box-shadow:0 0 0 2px #C65BD0 inset;background:#fff}
.ractions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ractions select,.otable select{font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:0;background:#FAF7FC;box-shadow:0 0 0 1px var(--line2) inset}
.otable{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:13.5px}
.otable td{background:#fff;padding:12px;vertical-align:middle}
.otable td:first-child{border-radius:14px 0 0 14px}.otable td:last-child{border-radius:0 14px 14px 0}
.otable small{display:block;color:var(--dim);font-size:11.5px}
.thread{margin:14px 0}
.bub{max-width:80%}
.bub.me{align-self:flex-start;background:#fff;color:var(--ink);box-shadow:var(--shadow);border-radius:20px 20px 20px 6px}
.bub.them{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px}
.bub.them .who{color:#F7A9DA}
.bub .who.c{color:var(--plum)}
.denied{max-width:460px;margin:60px auto;text-align:center}
@media (min-width:900px){.grid{grid-template-columns:380px 1fr}.back{display:none}.pane.sticky{position:sticky;top:12px}}
@media (max-width:899px){.grid.open .list{display:none}.grid:not(.open) .pane{display:none}}
</style>
</head>
<body>
<div class="desk">
  <div class="dtop"><img src="logo-ink.png" alt="LaunchAI"><span class="tag">Support desk</span><span class="preview sp" id="pv" hidden>🧪 Preview mode</span><button class="btn btn-soft sm" id="out" hidden>Sign out</button></div>

  <!-- sign in -->
  <main class="authwrap" id="auth" hidden style="min-height:auto;padding:40px 0">
    <div class="card" style="max-width:440px;margin:0 auto;width:100%">
      <h1 style="font-size:1.8rem">Team <span class="serif gt">sign in</span></h1>
      <p class="sub">Only LaunchAI staff can open the support desk.</p>
      <form id="fIn" novalidate>
        <div class="fld"><label for="iEm">Email</label><input id="iEm" type="email" autocomplete="username" required></div>
        <div class="fld"><label for="iPw">Password</label><input id="iPw" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-ink block" style="margin-top:16px">Sign in</button>
        <div class="msg" id="mIn" role="status"></div>
      </form>
    </div>
  </main>

  <div class="denied card" id="denied" hidden><h2>No access</h2><p class="sub">This account isn't on the support team. Ask an admin to add you.</p></div>

  <!-- desk -->
  <main id="desk" hidden>
    <div class="dtabs"><button class="on" data-v="tickets">💬 Tickets</button><button data-v="orders">📦 Orders</button></div>
    <section id="vTickets">
      <div class="filters" id="filters"></div>
      <div class="grid" id="tgrid"><div class="list" id="tlist"></div><div class="pane sticky" id="tpane"><div class="empty"><i>💬</i>Select a ticket to read and reply.</div></div></div>
    </section>
    <section id="vOrders" hidden>
      <table class="otable" id="otable"></table>
    </section>
  </main>
</div>

<script src="config.js?v=1"></script>
<script src="lx.js?v=1"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=d=>new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  const CANNED=[["👋 Thanks","Thanks for reaching out! We're looking into this and will update you shortly."],["✅ Done","Good news: this is done. Let us know if there's anything else we can help with."],["📎 Need info","Could you share a bit more detail (and any screenshots or links) so we can help faster?"],["💳 Billing","You can manage your subscription or update your card from the 'Manage or cancel' button on your order. If you'd like us to do it for you, just reply here."]];
  const FILTERS=[['need','Needs reply'],['answered','Answered'],['closed','Closed'],['all','All']];
  const TP={open:['Needs reply','y'],answered:['Answered','g'],closed:['Closed','']};
  let tickets=[],orders=[],filter='need',cur=null;

  try{await LX.ready()}catch(e){document.body.insertAdjacentHTML('beforeend',`<p class="note">${esc(e.message)}</p>`);return}
  $('#pv').hidden=!LX.DEMO;

  async function render(){const u=LX.user();$('#out').hidden=!u;
    if(!u){$('#auth').hidden=false;$('#desk').hidden=$('#denied').hidden=true;return}
    $('#auth').hidden=true;
    if(!await LX.isAdmin()){$('#denied').hidden=false;$('#desk').hidden=true;return}
    $('#denied').hidden=true;$('#desk').hidden=false;await load()}
  async function load(){try{[tickets,orders]=await Promise.all([LX.adminTickets(),LX.adminOrders()])}catch(e){$('#tlist').innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}drawList();drawOrders();const m=location.hash.match(/t=([\w-]+)/);if(m)openT(m[1])}
  const inFilter=t=>filter==='all'||(filter==='need'?t.status==='open':t.status===filter);
  function drawList(){const need=tickets.filter(t=>t.status==='open').length;
    $('#filters').innerHTML=FILTERS.map(([k,l])=>`<button class="${k===filter?'on':''}" data-f="${k}">${l}${k==='need'&&need?`<b>${need}</b>`:''}</button>`).join('');
    const list=tickets.filter(inFilter);
    $('#tlist').innerHTML=list.length?list.map(t=>{const c=t.customer||{};const [pl,pc]=TP[t.status]||[t.status,''];return `<button class="row ${t.status==='open'?'need':''} ${cur===t.id?'on':''}" data-t="${esc(t.id)}"><div class="t"><b>${esc(t.subject)}</b><span class="pill ${pc}">${pl}</span></div><p>${esc(t.last_message)}</p><small>#${esc(t.number)} · ${esc([c.first_name,c.last_name].filter(Boolean).join(' ')||t.email||'')} · ${fmt(t.last_at)}</small></button>`}).join(''):'<div class="empty"><i>🎉</i>Nothing here. Inbox zero!</div>'}
  function openT(id){const t=tickets.find(x=>String(x.id)===String(id));if(!t)return;cur=t.id;history.replaceState(null,'','#t='+t.id);$('#tgrid').classList.add('open');drawList();
    const c=t.customer||{};const o=t.order_id&&orders.find(x=>x.id===t.order_id);
    $('#tpane').innerHTML=`<button class="link back" id="back">← All tickets</button>
      <div class="th-head"><div><small>#${esc(t.number)} · ${esc(LX.TOPICS[t.topic]||'')} · opened ${fmt(t.created_at)}</small><h2>${esc(t.subject)}</h2></div></div>
      <div class="cust"><div>Customer<b>${esc([c.first_name,c.last_name].filter(Boolean).join(' ')||'—')}</b></div><div>Email<b>${esc(t.email||'—')}</b></div><div>Phone<b>${esc(c.phone||'—')}</b></div><div>${o?'Order':'Business'}<b>${esc(o?((LX.PLANS[o.plan]||{}).name||o.plan_name)+' · '+o.status:c.business_name||'—')}</b></div></div>
      <div class="thread">${t.messages.map(m=>`<div class="bub ${m.author_role==='support'?'them':'me'}"><div class="who ${m.author_role==='support'?'':'c'}">${m.author_role==='support'?'LaunchAI Support':'Customer'}</div><p>${esc(m.body)}</p><time>${fmt(m.created_at)}</time></div>`).join('')}</div>
      <form class="reply" id="rf" novalidate><div class="canned">${CANNED.map(([l],i)=>`<button type="button" data-c="${i}">${l}</button>`).join('')}</div>
        <textarea id="rB" maxlength="5000" placeholder="Write a reply. The customer sees it in their account and gets an email alert."></textarea>
        <div class="ractions"><button class="btn btn-main sm">Send reply</button><select id="st" aria-label="Status"><option value="open" ${t.status==='open'?'selected':''}>Needs reply</option><option value="answered" ${t.status==='answered'?'selected':''}>Answered</option><option value="closed" ${t.status==='closed'?'selected':''}>Closed</option></select><span class="msg" id="rM"></span></div></form>`;
    const th=$('#tpane .thread');th.scrollTop=th.scrollHeight}
  function drawOrders(){const opts=s=>LX.ORDER_STATUSES.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
    $('#otable').innerHTML=orders.length?orders.map(o=>`<tr><td><b>${esc((LX.PLANS[o.plan]||{}).name||o.plan_name||o.plan)}</b><small>${esc(o.email||'')}</small></td><td>${o.amount?'$'+(o.amount/100).toFixed(2):'—'}<small>${fmt(o.created_at)}</small></td><td><select data-o="${esc(o.id)}" aria-label="Order status">${opts(o.status)}</select></td></tr>`).join(''):'<tr><td class="empty">No orders yet.</td></tr>'}

  $('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;drawList()}});
  $('#tlist').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)openT(b.dataset.t)});
  $('#tpane').addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){const ta=$('#rB');ta.value=(ta.value?ta.value+'\n\n':'')+CANNED[+c.dataset.c][1];ta.focus()}if(e.target.closest('#back')){cur=null;$('#tgrid').classList.remove('open');history.replaceState(null,'','#');drawList()}});
  $('#tpane').addEventListener('change',async e=>{if(e.target.id!=='st')return;await LX.adminSetTicketStatus(cur,e.target.value);tickets=await LX.adminTickets();drawList()});
  $('#tpane').addEventListener('submit',async e=>{e.preventDefault();const ta=$('#rB'),m=$('#rM'),b=e.target.querySelector('button.btn');if(!ta.value.trim()){m.textContent='Write a reply first.';return}b.disabled=true;
    try{await LX.adminReply(cur,ta.value);tickets=await LX.adminTickets();openT(cur);$('#rM').className='msg ok';$('#rM').textContent='✓ Sent. The customer has been notified.'}catch(err){m.textContent=err.message;b.disabled=false}});
  $('#otable').addEventListener('change',async e=>{const s=e.target.closest('[data-o]');if(!s)return;try{await LX.adminSetOrderStatus(s.dataset.o,s.value);s.style.boxShadow='0 0 0 2px #12A15C inset'}catch(err){alert(err.message)}});
  $$('.dtabs button').forEach(b=>b.onclick=()=>{$$('.dtabs button').forEach(x=>x.classList.toggle('on',x===b));$('#vTickets').hidden=b.dataset.v!=='tickets';$('#vOrders').hidden=b.dataset.v!=='orders'});
  $('#fIn').addEventListener('submit',async e=>{e.preventDefault();const m=$('#mIn');m.textContent='';try{await LX.signIn($('#iEm').value,$('#iPw').value);render()}catch(err){m.textContent=err.message}});
  $('#out').onclick=async()=>{await LX.signOut();render()};
  render();
})();
</script>
</body>
</html>
